name: CI

on:
  push:
    branches: [dev, staging, main]
    paths:
      - 'app/**'
      - 'Dockerfile'
      - 'requirements.txt'
      - 'k8s/**'
      - '.github/workflows/**'
  pull_request:
    branches: [staging, main]
    paths:
      - 'app/**'
      - 'Dockerfile'
      - 'requirements.txt'

permissions:
  contents: read
  pull-requests: write

jobs:
  lint-and-test:
    name: Lint and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pytest-cov

      - name: Lint with flake8
        run: |
          flake8 app/ --max-line-length=100 --exclude=venv --statistics

      - name: Run tests with coverage
        run: |
          pytest app/tests/ -v \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=70

      - name: Post coverage comment on PR
        if: github.event_name == 'pull_request'
        uses: MishaKav/pytest-coverage-comment@main
        with:
          pytest-xml-coverage-path: coverage.xml
          title: Test coverage report

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: fluxdeploy:${{ github.sha }}

      - name: Run Trivy security scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: fluxdeploy:${{ github.sha }}
          format: table
          exit-code: 0
          severity: HIGH,CRITICAL

  deploy:
    name: Deploy to EKS
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/staging')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/fluxdeploy-dev:$IMAGE_TAG .
          docker push $ECR_REGISTRY/fluxdeploy-dev:$IMAGE_TAG
          docker tag $ECR_REGISTRY/fluxdeploy-dev:$IMAGE_TAG $ECR_REGISTRY/fluxdeploy-dev:latest
          docker push $ECR_REGISTRY/fluxdeploy-dev:latest

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.31.0'

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name ${{ secrets.EKS_CLUSTER_NAME }} \
            --region ${{ secrets.AWS_REGION }}

      - name: Determine namespace
        id: namespace
        run: |
          if [ "${{ github.ref }}" == "refs/heads/dev" ]; then
            echo "namespace=fluxdeploy-dev" >> $GITHUB_OUTPUT
            echo "overlay=dev" >> $GITHUB_OUTPUT
          else
            echo "namespace=fluxdeploy-staging" >> $GITHUB_OUTPUT
            echo "overlay=staging" >> $GITHUB_OUTPUT
          fi

      - name: Update image tag in deployment
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          sed -i "s|042608219714.dkr.ecr.ap-south-1.amazonaws.com/fluxdeploy-dev:latest|$ECR_REGISTRY/fluxdeploy-dev:$IMAGE_TAG|g" k8s/base/deployment.yaml

      - name: Deploy to EKS
        run: |
          kubectl apply -k k8s/overlays/${{ steps.namespace.outputs.overlay }}/
          kubectl rollout status deployment/fluxdeploy-api \
            -n ${{ steps.namespace.outputs.namespace }} \
            --timeout=300s

      - name: Rollback on failure
        if: failure()
        run: |
          echo "Deployment failed — rolling back"
          kubectl rollout undo deployment/fluxdeploy-api \
            -n ${{ steps.namespace.outputs.namespace }}
          kubectl rollout status deployment/fluxdeploy-api \
            -n ${{ steps.namespace.outputs.namespace }} \
            --timeout=120s